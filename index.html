<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大考中心英文單字 Level 4-6 聽力練習</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>" />
<link rel="stylesheet" href="style.css?v=__BUILD_VERSION__" />
</head>
<body>
<header class="topbar">
  <h1>🔊 高中英文參考詞彙表 <span class="muted">Level 4–6</span></h1>
  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-view="home">首頁</button>
    <button class="tab-btn" data-view="dictation">聽寫練習</button>
    <button class="tab-btn" data-view="review">複習卡片</button>
    <button class="tab-btn" data-view="stats">學習統計</button>
  </nav>
</header>

<main id="app">

  <!-- HOME / SETUP -->
  <section id="view-home" class="view active">
    <div class="card">
      <h2>選擇單字範圍</h2>
      <div class="level-picker" id="level-picker">
        <label class="level-chip"><input type="checkbox" value="4" checked><span>Level 4</span></label>
        <label class="level-chip"><input type="checkbox" value="5" checked><span>Level 5</span></label>
        <label class="level-chip"><input type="checkbox" value="6" checked><span>Level 6</span></label>
      </div>
      <p class="hint" id="level-count-hint"></p>

      <h2>語音設定</h2>
      <div class="row">
        <label for="voice-select">發音語音</label>
        <select id="voice-select"></select>
      </div>
      <div class="row">
        <label for="rate-select">語速</label>
        <input type="range" id="rate-select" min="0.5" max="1.3" step="0.1" value="0.9">
        <span id="rate-value">0.9x</span>
      </div>
      <div class="row">
        <button id="test-voice-btn" class="btn secondary">🔊 試聽</button>
      </div>

      <h2>開始練習</h2>
      <div class="row">
        <label for="session-size">每回合題數</label>
        <select id="session-size">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="0">全部（依範圍）</option>
        </select>
      </div>
      <div class="row actions">
        <button class="btn primary" id="start-dictation-btn">🎧 開始聽寫練習</button>
        <button class="btn primary" id="start-review-btn">🗂️ 開始複習卡片</button>
      </div>
      <p class="hint">聽寫練習：播放單字發音，輸入拼字，立即核對。<br>複習卡片：間隔複習系統（SRS），依熟悉度安排單字重複出現，直到記熟為止。</p>
    </div>
  </section>

  <!-- DICTATION MODE -->
  <section id="view-dictation" class="view">
    <div class="card center-card">
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" id="dict-progress-fill"></div></div>
        <span id="dict-progress-text">0 / 0</span>
      </div>
      <div class="level-badge" id="dict-level-badge">Level 4</div>

      <button class="play-btn" id="dict-play-btn" title="播放發音 (Enter 重播)">🔊</button>
      <p class="hint">聽發音，輸入你聽到的單字</p>

      <form id="dict-form" autocomplete="off">
        <input type="text" id="dict-input" placeholder="輸入單字..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <div class="row actions">
          <button type="button" class="btn secondary" id="dict-replay-btn">🔁 重播</button>
          <button type="submit" class="btn primary" id="dict-submit-btn">送出</button>
        </div>
      </form>

      <div id="dict-feedback" class="feedback hidden"></div>
      <button class="btn primary hidden" id="dict-next-btn">下一題 →</button>

      <div id="dict-summary" class="summary hidden">
        <h2>本回合結束！</h2>
        <p id="dict-summary-score"></p>
        <div id="dict-summary-missed"></div>
        <div id="dict-summary-all"></div>
        <div class="row actions">
          <button class="btn primary" id="dict-again-btn">再來一回合</button>
          <button class="btn secondary" id="dict-home-btn">回首頁</button>
        </div>
      </div>
    </div>
  </section>

  <!-- REVIEW MODE (flashcards / SRS) -->
  <section id="view-review" class="view">
    <div class="card center-card">
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" id="rev-progress-fill"></div></div>
        <span id="rev-progress-text">0 / 0</span>
      </div>
      <div class="level-badge" id="rev-level-badge">Level 4</div>

      <button class="play-btn" id="rev-play-btn" title="播放發音">🔊</button>

      <div class="flashcard" id="rev-flashcard">
        <div class="flashcard-word hidden" id="rev-word"></div>
        <div class="flashcard-pos hidden" id="rev-pos"></div>
        <div class="flashcard-zh hidden" id="rev-zh"></div>
        <p class="hint" id="rev-hint">先聽發音，猜猜看這個字怎麼拼、什麼意思，再按「顯示答案」</p>
      </div>

      <button class="btn primary" id="rev-reveal-btn">👁️ 顯示答案</button>

      <div class="row actions grade-row hidden" id="rev-grade-row">
        <button class="btn grade again" data-grade="again">忘記了</button>
        <button class="btn grade hard" data-grade="hard">有點難</button>
        <button class="btn grade good" data-grade="good">記得</button>
        <button class="btn grade easy" data-grade="easy">很熟悉</button>
      </div>

      <div id="rev-summary" class="summary hidden">
        <h2>本回合複習完成！</h2>
        <p id="rev-summary-score"></p>
        <div id="rev-summary-words"></div>
        <div class="row actions">
          <button class="btn primary" id="rev-again-btn">再來一回合</button>
          <button class="btn secondary" id="rev-home-btn">回首頁</button>
        </div>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section id="view-stats" class="view">
    <div class="card">
      <h2>學習統計</h2>
      <div class="stats-grid" id="stats-grid"></div>
      <p class="hint" id="stats-speed-hint"></p>
      <h2>各等級熟悉度</h2>
      <div id="stats-levels"></div>
      <div class="row actions">
        <button class="btn danger" id="reset-progress-btn">清除全部學習紀錄</button>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>資料來源：大學入學考試中心「高中英文參考詞彙表」（108 課綱），Level 4–6，共 <span id="footer-total"></span> 字。</p>
  <p class="update-row">
    <button id="update-check-btn" class="btn secondary small">🔄 檢查更新</button>
    <span id="update-status" class="update-status"></span>
  </p>
</footer>

<div id="update-toast" class="update-toast hidden"></div>

<script src="app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
